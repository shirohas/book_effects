<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">見開きの座標：背表紙を x = 0 にする</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#267e87"/></marker><linearGradient id="paper"><stop stop-color="#a9bfc1"/><stop offset=".45" stop-color="#fffdf4"/><stop offset="1" stop-color="#d7e1df"/></linearGradient></defs><rect width="960" height="480" rx="18" fill="#f8faf9"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="28" y="40" font-size="25" fill="#193843">見開きの座標：背表紙を x = 0 にする</text><rect x="90" y="85" width="780" height="310" rx="10" fill="#e8f0f3" stroke="#96b1ba" stroke-dasharray="8 6"/><rect x="140" y="120" width="680" height="235" fill="#fffdf5" stroke="#687f84"/><path d="M480 105 V375" stroke="#e08048" stroke-width="3"/><text x="180" y="200" font-size="24" fill="#193843">左ページ</text><text x="595" y="200" font-size="24" fill="#193843">右ページ</text><text x="170" y="255" font-size="18" fill="#193843">−PAGE_WIDTH</text><text x="530" y="255" font-size="18" fill="#193843">+PAGE_WIDTH</text><text x="490" y="155" font-size="18" fill="#193843">(0, 0)</text><path d="M480 295 L770 295" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><text x="633" y="283" font-size="16" fill="#193843">x</text><text x="105" y="72" font-size="19" fill="#193843">Canvas：周囲にcanvasPaddingを確保</text><text x="130" y="430" font-size="20" fill="#193843">画面座標 → bookの左上を引く → scaleで割る → 背表紙へ原点移動</text></g></svg>