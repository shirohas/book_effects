<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">描画の重なりと責務</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#267e87"/></marker><linearGradient id="paper"><stop stop-color="#a9bfc1"/><stop offset=".45" stop-color="#fffdf4"/><stop offset="1" stop-color="#d7e1df"/></linearGradient></defs><rect width="960" height="480" rx="18" fill="#f8faf9"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="28" y="40" font-size="25" fill="#193843">描画の重なりと責務</text><rect x="45" y="90" width="420" height="110" rx="12" fill="#e4f2ef" stroke="#8ca6ac"/><text x="63" y="122" font-size="22" fill="#193843">Reactが管理するDOM</text><text x="63" y="154" font-size="17" fill="#193843">bf-viewport / bf-book / bf-pages / 各面</text><rect x="45" y="245" width="420" height="145" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="63" y="277" font-size="22" fill="#193843">エンジンが変更する部分</text><text x="63" y="309" font-size="17" fill="#193843">style.width・CSS変数・data-layout</text><text x="63" y="335" font-size="17" fill="#193843">is-current・is-turning</text><text x="63" y="361" font-size="17" fill="#193843">イベント・タイマー・Observer</text><rect x="555" y="90" width="350" height="90" rx="12" fill="#fbefdf" stroke="#8ca6ac"/><text x="573" y="122" font-size="22" fill="#193843">上：Canvas</text><text x="573" y="154" font-size="17" fill="#193843">折れた紙、影、左側の裏面</text><rect x="555" y="215" width="350" height="90" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="573" y="247" font-size="22" fill="#193843">中：DOMの表面</text><text x="573" y="279" font-size="17" fill="#193843">幅を狭めて下の面を見せる</text><rect x="555" y="340" width="350" height="90" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="573" y="372" font-size="22" fill="#193843">下：後続の紙</text><text x="573" y="404" font-size="17" fill="#193843">zIndex = 紙の枚数 − index</text><path d="M255 200 L255 245" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 340 L730 305" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 215 L730 180" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/></g></svg>