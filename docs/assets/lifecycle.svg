<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">Reactのライフサイクルと描画エンジン</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#267e87"/></marker><linearGradient id="paper"><stop stop-color="#a9bfc1"/><stop offset=".45" stop-color="#fffdf4"/><stop offset="1" stop-color="#d7e1df"/></linearGradient></defs><rect width="960" height="480" rx="18" fill="#f8faf9"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="28" y="40" font-size="25" fill="#193843">Reactのライフサイクルと描画エンジン</text><rect x="25" y="85" width="205" height="115" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="43" y="117" font-size="22" fill="#193843">React render</text><text x="43" y="149" font-size="17" fill="#193843">childrenを面に整理</text><text x="43" y="175" font-size="17" fill="#193843">refでDOMを取得</text><rect x="270" y="85" width="205" height="115" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="288" y="117" font-size="22" fill="#193843">Effect setup</text><text x="288" y="149" font-size="17" fill="#193843">initializeBook()</text><text x="288" y="175" font-size="17" fill="#193843">寸法・監視・イベント</text><rect x="515" y="85" width="205" height="115" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="533" y="117" font-size="22" fill="#193843">操作・描画</text><text x="533" y="149" font-size="17" fill="#193843">DOMの幅 / Canvas</text><text x="533" y="175" font-size="17" fill="#193843">確定後にcallback</text><rect x="755" y="85" width="180" height="115" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="773" y="117" font-size="22" fill="#193843">cleanup</text><text x="773" y="149" font-size="17" fill="#193843">timer / rAF停止</text><text x="773" y="175" font-size="17" fill="#193843">監視と購読を解除</text><path d="M230 140 L270 140" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><path d="M475 140 L515 140" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 140 L755 140" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><rect x="110" y="285" width="740" height="125" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="128" y="317" font-size="22" fill="#193843">再初期化が起きる条件</text><text x="128" y="349" font-size="17" fill="#193843">layout・mobileBreakpoint・pageRatio・facesの参照が変化</text><text x="128" y="375" font-size="17" fill="#193843">selected refで面番号を引き継ぎ、新しいDOMから転写し直す</text><path d="M840 210 L840 270" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><path d="M120 275 L310 210" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/></g></svg>