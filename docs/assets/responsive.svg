<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">モード判定とページの実寸は別の計算</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#267e87"/></marker><linearGradient id="paper"><stop stop-color="#a9bfc1"/><stop offset=".45" stop-color="#fffdf4"/><stop offset="1" stop-color="#d7e1df"/></linearGradient></defs><rect width="960" height="480" rx="18" fill="#f8faf9"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="28" y="40" font-size="25" fill="#193843">モード判定とページの実寸は別の計算</text><rect x="30" y="85" width="270" height="130" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="48" y="117" font-size="22" fill="#193843">外側コンテナの幅</text><text x="48" y="149" font-size="17" fill="#193843">viewport.clientWidth</text><text x="48" y="175" font-size="17" fill="#193843">mobileBreakpoint = 700</text><rect x="380" y="85" width="540" height="130" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="398" y="117" font-size="22" fill="#193843">700pxより広い → 見開き</text><text x="398" y="149" font-size="17" fill="#193843">元の寸法を保ったまま全体をscale</text><text x="398" y="175" font-size="17" fill="#193843">幅と高さの両方から収まる倍率を選ぶ</text><rect x="380" y="285" width="540" height="140" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="398" y="317" font-size="22" fill="#193843">700px以下 → 片面</text><text x="398" y="349" font-size="17" fill="#193843">基本は幅92%、画面458px以下は100%</text><text x="398" y="375" font-size="17" fill="#193843">height = width / pageRatio</text><text x="398" y="401" font-size="17" fill="#193843">本文は折り返し直し、必要なら面内スクロール</text><path d="M300 135 L380 135" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><text x="348" y="123" font-size="16" fill="#193843">広い</text><path d="M250 215 L380 320" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><text x="323" y="255.5" font-size="16" fill="#193843">狭い</text></g></svg>