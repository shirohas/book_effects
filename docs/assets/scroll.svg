<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">面内スクロールと転写のずれ（現行の制約）</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#267e87"/></marker><linearGradient id="paper"><stop stop-color="#a9bfc1"/><stop offset=".45" stop-color="#fffdf4"/><stop offset="1" stop-color="#d7e1df"/></linearGradient></defs><rect width="960" height="480" rx="18" fill="#f8faf9"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="28" y="40" font-size="25" fill="#193843">面内スクロールと転写のずれ（現行の制約）</text><rect x="35" y="85" width="380" height="300" rx="12" fill="#e8f3ef" stroke="#8ca6ac"/><text x="53" y="117" font-size="22" fill="#193843">ユーザーが見ている面</text><rect x="85" y="155" width="270" height="180" fill="white" stroke="#839a9f"/><text x="110" y="195" font-size="22" fill="#193843">本文の途中 …</text><text x="110" y="235" font-size="22" fill="#193843">読み進めた位置</text><text x="110" y="290" font-size="20" fill="#193843">scrollTop = 88</text><rect x="545" y="85" width="380" height="300" rx="12" fill="#fbefdf" stroke="#8ca6ac"/><text x="563" y="117" font-size="22" fill="#193843">転写用に複製した面</text><rect x="595" y="155" width="270" height="180" fill="white" stroke="#839a9f"/><text x="620" y="195" font-size="22" fill="#193843">先頭の見出し</text><text x="620" y="235" font-size="22" fill="#193843">本文の最初 …</text><text x="620" y="290" font-size="20" fill="#193843">scrollTop = 0</text><path d="M425 240 L535 240" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><text x="488" y="228" font-size="16" fill="#193843">複製</text><text x="40" y="435" font-size="19" fill="#193843">めくり始めに内容が跳ぶ。スクロールしていない面では、このずれは起きない。</text></g></svg>