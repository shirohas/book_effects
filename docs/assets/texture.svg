<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">DOMの見た目をCanvasへ運ぶ</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#267e87"/></marker><linearGradient id="paper"><stop stop-color="#a9bfc1"/><stop offset=".45" stop-color="#fffdf4"/><stop offset="1" stop-color="#d7e1df"/></linearGradient></defs><rect width="960" height="480" rx="18" fill="#f8faf9"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="28" y="40" font-size="25" fill="#193843">DOMの見た目をCanvasへ運ぶ</text><rect x="25" y="100" width="190" height="145" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="43" y="132" font-size="22" fill="#193843">① DOM複製</text><text x="43" y="164" font-size="17" fill="#193843">cloneNode(true)</text><text x="43" y="190" font-size="17" fill="#193843">子孫も複製</text><rect x="265" y="100" width="190" height="145" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="283" y="132" font-size="22" fill="#193843">② CSS固定</text><text x="283" y="164" font-size="17" fill="#193843">getComputedStyle</text><text x="283" y="190" font-size="17" fill="#193843">全プロパティを転写</text><rect x="505" y="100" width="190" height="145" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="523" y="132" font-size="22" fill="#193843">③ SVG化</text><text x="523" y="164" font-size="17" fill="#193843">foreignObject</text><text x="523" y="190" font-size="17" fill="#193843">XMLSerializer</text><rect x="745" y="100" width="190" height="145" rx="12" fill="#eef5f5" stroke="#8ca6ac"/><text x="763" y="132" font-size="22" fill="#193843">④ Image</text><text x="763" y="164" font-size="17" fill="#193843">data URLを読込</text><text x="763" y="190" font-size="17" fill="#193843">onload後に描画</text><path d="M215 175 L265 175" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><path d="M455 175 L505 175" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 175 L745 175" fill="none" stroke="#267e87" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="315" width="790" height="105" rx="12" fill="#fbefdf" stroke="#8ca6ac"/><text x="103" y="347" font-size="22" fill="#193843">注意：DOMの現在状態すべてが画像になるわけではない</text><text x="103" y="379" font-size="17" fill="#193843">scrollTop・動画・子Canvas・擬似要素・外部リソースは別途考慮が必要</text></g></svg>